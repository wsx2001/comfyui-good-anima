[build-project]
name = "comfyui-good-anima-chat"
version = "0.1.0"
description = "Local AI chat frontend for the comfyui-good-anima v2mini skills"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RET", "SIM"]